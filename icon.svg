<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Circle -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.15"/>
  
  <!-- Main Icon Group with Drop Shadow -->
  <g filter="url(#shadow)">
    <!-- Graduation Cap Top Diamond -->
    <path d="M256 120 L420 200 L256 280 L92 200 Z" fill="url(#capGrad)"/>
    
    <!-- Cap Skull Base -->
    <path d="M148 238 L148 316 C148 368 364 368 364 316 L364 238 L256 288 Z" fill="#ffffff" fill-opacity="0.92"/>
    
    <!-- Tassel Cord & Hanging Drop -->
    <path d="M390 215 L430 260 L430 350" fill="none" stroke="#fbbf24" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="430" cy="358" r="14" fill="#fbbf24"/>
    
    <!-- Bookmark / Open Book Badge Accent at Bottom -->
    <path d="M196 380 C220 370 248 375 256 385 C264 375 292 370 316 380 L316 410 C292 400 264 405 256 415 C248 405 220 400 196 410 Z" fill="#38bdf8"/>
  </g>
</svg>
